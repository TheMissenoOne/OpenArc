name: Release

# The standalone download (stage0/tools/build-binary.ts, built and checked by binary.yml) for each platform, attached
# to the GitHub Release of the tag with a SHA256SUMS file. npm stays the main channel; this workflow publishes nothing to npm.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and attach to, e.g. v0.11.0"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    uses: ./.github/workflows/binary.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      upload: true

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum openarc-*.tar.gz openarc-*.zip | tee SHA256SUMS
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --notes "Standalone downloads: see the wiki's Install page. npm: \`npm i -D open-arc\`."
          gh release upload "$TAG" dist/openarc-* dist/SHA256SUMS --clobber
