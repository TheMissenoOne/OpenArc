name: Release

# The standalone download (stage0/tools/build-binary.ts) for each POSIX runner, attached to the GitHub Release of the
# tag with a SHA256SUMS file. npm stays the main channel; this workflow publishes nothing to npm.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and attach to, e.g. v0.11.0"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest] # linux-x64, linux-arm64, darwin-arm64; no Windows launcher
    defaults:
      run:
        shell: bash
        working-directory: stage0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 25.x # the runtime the download ships

      - name: Tag matches the package version
        run: |
          v="v$(node -p 'require("./core/package.json").version')"
          [ "$v" = "$TAG" ] || { echo "tag $TAG but core/package.json says $v"; exit 1; }

      - name: Install
        run: npm ci

      # builds build/openarc-<version>-<os>-<arch>.tar.gz, then runs it with no node on the PATH
      - name: Build and check the standalone download
        run: OPENARC_BINARY_CHECK=1 node --no-warnings tests/binary.check.ts

      - uses: actions/upload-artifact@v4
        with:
          name: openarc-${{ matrix.os }}
          path: stage0/build/openarc-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum openarc-*.tar.gz | tee SHA256SUMS
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --notes "Standalone downloads: see the wiki's Install page. npm: \`npm i -D open-arc\`."
          gh release upload "$TAG" dist/openarc-*.tar.gz dist/SHA256SUMS --clobber
